name: Lead reminders

# Calls the reminder sweep on the live site.
#
# This lives here rather than in vercel.json because Vercel's Hobby plan caps
# cron at one run per day, and any expression firing more often fails at deploy
# time. A daily sweep is a next-day summary, not a follow-up. GitHub's
# scheduler is free and runs as often as needed.
#
# GitHub schedules are best effort and commonly drift five to fifteen minutes,
# which is irrelevant against an eight hour threshold. Note that GitHub
# disables scheduled workflows on repositories with no activity for 60 days.
#
# On Vercel Pro this becomes a vercel.json cron entry and this file is deleted.
# The endpoint does not change.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Call the reminder sweep
        env:
          ENDPOINT: ${{ secrets.LEAD_REMINDER_ENDPOINT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$ENDPOINT" ] || [ -z "$CRON_SECRET" ]; then
            echo "LEAD_REMINDER_ENDPOINT or CRON_SECRET is not set in repository secrets."
            exit 1
          fi

          # Body and status are printed, never the secret. -sS keeps the
          # progress meter out of the log while leaving errors visible.
          status=$(curl -sS -o response.txt -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$ENDPOINT")

          echo "HTTP $status"
          cat response.txt

          # A sweep that cannot run is a silent failure otherwise: leads go
          # unchased and the only evidence is a green tick.
          if [ "$status" != "200" ]; then
            exit 1
          fi
